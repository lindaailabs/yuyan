schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Yuyan（语燕）— AI 宠物应用：一只有记忆、会成长、能对话的虚拟宠物。
  一期 MVP 主线是“陪伴闭环”，不是人与人 IM 闭环。

  一期目标：
  - 用户注册登录并完成资料设置
  - 创建/领养 AI 宠物
  - 文本对话通过 AI Gateway 生成回复
  - 宠物能抽取、召回、展示和删除长期记忆
  - 宠物状态、亲密度、等级和成长事件随互动变化
  - 服务端记录 AI token、延迟、成本、错误和基础留存事件
  - 订阅权益模型由服务端作为唯一事实源，真实支付接入可后置

  技术栈（已定案）：
  - 客户端：Flutter + Riverpod + drift，WebSocket + Dio
  - 服务端：Go 单体（Gin + GORM），MySQL 8.x（InnoDB/utf8mb4）+ Redis 7
  - AI 链路：AI Gateway 封装模型、prompt、上下文、用量、降级和兜底
  - 部署：Docker Compose 单机

  权威规范：docs/LLM_DEV_GUIDE.md（任何变更前必读，冲突时以它为准）。
  分层约束：Go 侧 api/ws → service → repo；Flutter 侧 UI → provider → repository。
  消息可靠性：client_msg_id 幂等去重，msg_id 自增作游标，禁止 offset/时间戳分页。
  宠物成长：服务端确定性规则决定核心数值，大模型只负责表达。
  Out of Scope（一期禁止主动实现）：好友关系、群聊、多人 IM、多媒体消息、实时语音生产链路、微服务。
  Conventional Commits；测试要求见 guide §10。

