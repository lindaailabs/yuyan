name: yuyan_app
description: "Yuyan（语燕）AI 宠物应用客户端。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理（guide §6.2：仅 Riverpod）
  flutter_riverpod: ^2.6.1
  # 路由
  go_router: ^16.0.0
  # 本地存储
  drift: ^2.28.0
  # 安全存储（token；guide §5.3）
  flutter_secure_storage: ^9.2.4
  # 网络（repository 接口占位使用）
  dio: ^5.9.0
  web_socket_channel: ^3.0.3
  # Web 平台浏览器 API（token 本地联调 fallback）
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # drift 代码生成
  drift_dev: ^2.28.0
  build_runner: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/user_avatars/
    - assets/pet_avatars/
    - assets/config.json
    - assets/config.test.json
    - assets/config.prod.json

